name: pyhealth
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python>=3.10,<3.14
  - pip
  - pytorch>=2.7.1
  - torchvision
  - numpy=1.26.4
  - pandas=2.3.1
  - scikit-learn=1.7.0
  - tqdm
  - networkx
  - pip:
    - transformers~=4.53.2
    - peft
    - accelerate
    - rdkit
    - ogb>=1.3.5
    - mne~=1.10.0
    - urllib3~=2.5.0
    - polars~=1.31.0
    - pandarallel~=1.6.5
    - pydantic~=2.11.7
    - -e .

